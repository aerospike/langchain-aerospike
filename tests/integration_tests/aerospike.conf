service {
    cluster-name langchain-aerospike-kv-tests
    proto-fd-max 15000
    service-threads 4
}

logging {
    console {
        context any info
    }
}

network {
    service {
        address any
        port 3000
        access-address 127.0.0.1
        access-port 3000
    }
    heartbeat {
        mode mesh
        address any
        port 3002
        interval 150
        timeout 10
    }
    fabric {
        address any
        port 3001
    }
}

namespace test_sc {
    replication-factor 1
    strong-consistency true
    default-ttl 0
    nsup-period 1
    max-record-size 1M
    mrt-duration 10
    storage-engine device {
        file /opt/aerospike/data/test_sc.dat
        filesize 4G
    }
}
